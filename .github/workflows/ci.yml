name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, testes e OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Cache do binário do MongoDB de testes
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Formatação
        run: pnpm format:check

      - name: Verificação de tipos
        run: pnpm typecheck

      - name: Testes (unitários, integração e contrato)
        run: pnpm test

      - name: Validar OpenAPI
        run: pnpm openapi:lint

      - name: Auditoria de dependências de produção
        run: pnpm audit --prod --audit-level high

      - name: Build
        run: pnpm build

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: task-management-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
